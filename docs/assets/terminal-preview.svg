    <text x="0" y="44" fill="#f87171">[error] broken-link .wiki/pages/team.md:14: [[Nobody]]</text>
    <text x="0" y="64" fill="#f87171">[error] uncited-claim .wiki/pages/team.md:12: no [[src-…]]</text>
