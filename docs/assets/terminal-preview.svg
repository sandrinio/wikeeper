<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <!-- Terminal Window Frame -->
  <rect width="960" height="320" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
